<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find your snowplow name</title>
<style>
  :root{--ice:#eaf7ff;--sky:#bfe8ff;--navy:#14324a;--blue:#1576a8;--deep:#0a547c;--white:#fff;--shadow:0 16px 42px rgba(20,50,74,.16)}
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:var(--navy);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .plow-picker{position:relative;isolation:isolate;overflow:hidden;max-width:760px;margin:0 auto;padding:clamp(22px,5vw,42px);border:1px solid #cbe9f9;border-radius:22px;background:linear-gradient(160deg,#fff 0%,var(--ice) 58%,#dff3ff 100%);box-shadow:var(--shadow);text-align:center}
  .plow-picker:before,.plow-picker:after{content:"❄";position:absolute;z-index:-1;color:#9ed9f6;opacity:.42;font-size:clamp(88px,18vw,150px);line-height:1}
  .plow-picker:before{top:-30px;left:-24px;transform:rotate(13deg)}
  .plow-picker:after{right:-20px;bottom:-34px;transform:rotate(-18deg)}
  .eyebrow{margin:0 0 8px;color:var(--deep);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{max-width:620px;margin:0 auto 10px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,6vw,3.35rem);line-height:1.03;letter-spacing:-.035em}
  .dek{max-width:580px;margin:0 auto 24px;font-size:clamp(1rem,2.5vw,1.16rem);line-height:1.5}
  button{appearance:none;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:14px 22px;font:800 1rem/1 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 7px 0 #0b5278;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
  button:hover{background:var(--deep);transform:translateY(-1px);box-shadow:0 8px 0 #083f5d}
  button:active{transform:translateY(5px);box-shadow:0 2px 0 #083f5d}
  button:focus-visible{outline:3px solid #f6b73c;outline-offset:4px}
  .result{display:none;max-width:620px;margin:30px auto 0;padding:clamp(20px,5vw,32px);border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 9px 25px rgba(20,50,74,.13);text-align:left}
  .result.show{display:block;animation:drift-in .38s ease-out}
  .label{margin:0 0 4px;color:#557183;font-size:.76rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .name{margin:0;color:#0d628e;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,8vw,3.7rem);line-height:1;overflow-wrap:anywhere}
  .rank{margin:14px 0 0;font-size:1.03rem;font-weight:700;line-height:1.45}
  .places{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
  .places li{padding:9px 12px;border-left:4px solid var(--sky);border-radius:8px;background:#f4fbff;line-height:1.35}
  .year{white-space:nowrap;color:#526d7e;font-variant-numeric:tabular-nums}
  .again{margin-top:20px;background:#fff;color:var(--deep);border:2px solid var(--blue);box-shadow:none;padding:11px 18px}
  .again:hover{background:#effaff;box-shadow:none;transform:none}
  .source-note{margin:18px 0 0;color:#607888;font-size:.82rem;line-height:1.45}
  @keyframes drift-in{from{opacity:0;transform:translateY(12px) rotate(-.4deg)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="plow-picker" aria-labelledby="plow-title">
  <p class="eyebrow">Michigan snowplow name generator</p>
  <h1 id="plow-title">What’s your snowplow name?</h1>
  <p class="dek">We rounded up 485 snowplow names chosen around Michigan. Let fate, and a little lake-effect snow, pick yours.</p>
  <button id="pick" type="button">Pick my snowplow name</button>
  <div id="result" class="result" aria-live="polite" aria-atomic="true">
    <p class="label">Your snowplow name is</p>
    <h2 id="name" class="name"></h2>
    <p id="rank" class="rank"></p>
    <ul id="places" class="places"></ul>
    <button id="again" class="again" type="button">Pick another</button>
  </div>
  <p class="source-note">Names reflect the places and years listed in the source data. Repeated names are grouped together.</p>
</section>

  const rankEl=document.getElementById('rank');
  const placesEl=document.getElementById('places');
  let last=-1;
  const ordinal=n=>{const m=n%100;return n+((m>=11&&m<=13)?'th':{1:'st',2:'nd',3:'rd'}[n%10]||'th')};
  const choose=()=>{
    let i;
    do{i=Math.floor(Math.random()*names.length)}while(names.length>1&&i===last);

    rankEl.textContent=item.count===1
